version: '3.8'

services:
  # Python FastAPI Backend
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MAX_SCENES=8
      - VIDEO_RESOLUTION=1280x720
      - PORT=8000
      - DEBUG=false
    volumes:
      - ./temp/python:/tmp/animated_stories
      - ./logs/python:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Express Backend
  backend-nodejs:
    build:
      context: ./backend-nodejs
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MAX_SCENES=8
      - VIDEO_RESOLUTION=1280x720
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./temp/nodejs:/app/temp
      - ./logs/nodejs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend-python
      - backend-nodejs
    restart: unless-stopped

volumes:
  python_temp:
  nodejs_temp:
  logs: